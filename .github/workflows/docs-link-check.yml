name: Docs link check

# Once a week: does every "official docs" link on the site still answer?
# Reads the links from public/data. No database, no AI, no secrets, and it
# changes nothing on the site. Dead links go into one issue, which is kept up
# to date and closed when none is left.

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check the links
        id: links
        run: node scripts/check-docs-links.mjs --report=docs-links.md

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEAD: ${{ steps.links.outputs.dead }}
        run: |
          TITLE="Dead official docs links"
          NUMBER=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          if [ "${DEAD:-0}" -gt 0 ]; then
            if [ -n "$NUMBER" ]; then
              gh issue edit "$NUMBER" --body-file docs-links.md
            else
              gh issue create --title "$TITLE" --body-file docs-links.md
            fi
          elif [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" --comment "No dead links in this week's check."
          fi
